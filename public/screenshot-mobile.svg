<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" role="img" aria-label="Mobile website screenshot mockup">
  <rect width="375" height="812" fill="#f8fafc"/>

  <!-- Header -->
  <rect y="0" width="375" height="56" fill="#ffffff"/>
  <rect x="16" y="18" width="100" height="20" rx="3" fill="#2563eb" opacity="0.3"/>
  <g transform="translate(303 0)">
    <rect x="0" y="16" width="24" height="24" rx="3" fill="#cbd5e1"/>
    <rect x="32" y="16" width="24" height="24" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- Hero section -->
  <g transform="translate(0 56)">
    <rect width="375" height="340" fill="#e2e8f0"/>
    <rect width="375" height="340" fill="url(#mobileHeroGrad)" opacity="0.7"/>
    <defs>
      <linearGradient id="mobileHeroGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1"/>
      </linearGradient>
    </defs>

    <!-- Hero content -->
    <g transform="translate(24 80)">
      <rect width="280" height="36" rx="3" fill="#0f172a" opacity="0.15"/>
      <rect y="48" width="240" height="24" rx="2" fill="#64748b" opacity="0.2"/>
      <rect y="80" width="220" height="24" rx="2" fill="#64748b" opacity="0.2"/>
      <rect y="128" width="140" height="40" rx="5" fill="#2563eb" opacity="0.4"/>
    </g>

    <!-- Stat cards (stacked) -->
    <g transform="translate(24 240)">
      <rect width="160" height="88" rx="6" fill="#ffffff" opacity="0.95"/>
      <rect x="12" y="12" width="60" height="28" rx="3" fill="#2563eb" opacity="0.15"/>
      <rect x="12" y="48" width="100" height="12" rx="2" fill="#cbd5e1"/>
      <rect x="12" y="66" width="80" height="10" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(191 240)">
      <rect width="160" height="88" rx="6" fill="#ffffff" opacity="0.95"/>
      <rect x="12" y="12" width="60" height="28" rx="3" fill="#2563eb" opacity="0.15"/>
      <rect x="12" y="48" width="100" height="12" rx="2" fill="#cbd5e1"/>
      <rect x="12" y="66" width="80" height="10" rx="2" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Services section -->
  <g transform="translate(0 396)">
    <rect y="32" width="375" height="384" fill="#ffffff"/>

    <!-- Section header -->
    <g transform="translate(24 48)">
      <rect width="80" height="10" rx="2" fill="#2563eb" opacity="0.3"/>
      <rect y="20" width="240" height="24" rx="2" fill="#0f172a" opacity="0.15"/>
    </g>

    <!-- Service cards (stacked) -->
    <g transform="translate(24 108)">
      <rect width="327" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="20" cy="20" r="14" fill="#2563eb" opacity="0.15"/>
      <rect x="20" y="46" width="220" height="12" rx="2" fill="#cbd5e1"/>
      <rect x="20" y="64" width="160" height="10" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(24 220)">
      <rect width="327" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="20" cy="20" r="14" fill="#2563eb" opacity="0.15"/>
      <rect x="20" y="46" width="220" height="12" rx="2" fill="#cbd5e1"/>
      <rect x="20" y="64" width="160" height="10" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(24 332)">
      <rect width="327" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="20" cy="20" r="14" fill="#2563eb" opacity="0.15"/>
      <rect x="20" y="46" width="220" height="12" rx="2" fill="#cbd5e1"/>
      <rect x="20" y="64" width="160" height="10" rx="2" fill="#e2e8f0"/>
    </g>
  </g>
</svg>
