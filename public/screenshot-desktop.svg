<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Desktop website screenshot mockup">
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Header -->
  <rect y="0" width="1200" height="64" fill="#ffffff"/>
  <rect x="48" y="20" width="140" height="24" rx="4" fill="#2563eb" opacity="0.3"/>
  <g transform="translate(880 0)">
    <rect x="0" y="22" width="72" height="20" rx="3" fill="#cbd5e1"/>
    <rect x="88" y="22" width="72" height="20" rx="3" fill="#cbd5e1"/>
    <rect x="176" y="18" width="96" height="28" rx="4" fill="#2563eb" opacity="0.3"/>
  </g>

  <!-- Hero section -->
  <g transform="translate(0 64)">
    <rect width="1200" height="480" fill="#e2e8f0"/>
    <rect width="1200" height="480" fill="url(#heroGrad)" opacity="0.7"/>
    <defs>
      <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1"/>
      </linearGradient>
    </defs>

    <!-- Hero content -->
    <g transform="translate(80 140)">
      <rect width="480" height="48" rx="4" fill="#0f172a" opacity="0.15"/>
      <rect y="68" width="420" height="32" rx="3" fill="#64748b" opacity="0.2"/>
      <rect y="116" width="380" height="32" rx="3" fill="#64748b" opacity="0.2"/>
      <rect y="176" width="180" height="48" rx="6" fill="#2563eb" opacity="0.4"/>
      <rect x="196" y="176" width="180" height="48" rx="6" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Stats cards -->
    <g transform="translate(680 160)">
      <rect width="220" height="140" rx="8" fill="#ffffff" opacity="0.9"/>
      <rect x="16" y="20" width="80" height="40" rx="4" fill="#2563eb" opacity="0.15"/>
      <rect x="16" y="72" width="140" height="16" rx="2" fill="#cbd5e1"/>
      <rect x="16" y="96" width="100" height="12" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(920 160)">
      <rect width="220" height="140" rx="8" fill="#ffffff" opacity="0.9"/>
      <rect x="16" y="20" width="80" height="40" rx="4" fill="#2563eb" opacity="0.15"/>
      <rect x="16" y="72" width="140" height="16" rx="2" fill="#cbd5e1"/>
      <rect x="16" y="96" width="100" height="12" rx="2" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Services section -->
  <g transform="translate(0 544)">
    <rect y="48" width="1200" height="208" fill="#ffffff"/>

    <!-- Section header -->
    <g transform="translate(80 64)">
      <rect width="100" height="12" rx="2" fill="#2563eb" opacity="0.3"/>
      <rect y="24" width="320" height="32" rx="3" fill="#0f172a" opacity="0.15"/>
    </g>

    <!-- Service cards -->
    <g transform="translate(80 136)">
      <rect width="250" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="24" r="16" fill="#2563eb" opacity="0.15"/>
      <rect x="24" y="56" width="180" height="14" rx="2" fill="#cbd5e1"/>
      <rect x="24" y="78" width="140" height="10" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(350 136)">
      <rect width="250" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="24" r="16" fill="#2563eb" opacity="0.15"/>
      <rect x="24" y="56" width="180" height="14" rx="2" fill="#cbd5e1"/>
      <rect x="24" y="78" width="140" height="10" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(620 136)">
      <rect width="250" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="24" r="16" fill="#2563eb" opacity="0.15"/>
      <rect x="24" y="56" width="180" height="14" rx="2" fill="#cbd5e1"/>
      <rect x="24" y="78" width="140" height="10" rx="2" fill="#e2e8f0"/>
    </g>
    <g transform="translate(890 136)">
      <rect width="250" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="24" cy="24" r="16" fill="#2563eb" opacity="0.15"/>
      <rect x="24" y="56" width="180" height="14" rx="2" fill="#cbd5e1"/>
      <rect x="24" y="78" width="140" height="10" rx="2" fill="#e2e8f0"/>
    </g>
